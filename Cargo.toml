[workspace]
resolver = "2"
members = ["crates/tp-marketdata", "crates/tp-scan-engine", "crates/tp-scan-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
