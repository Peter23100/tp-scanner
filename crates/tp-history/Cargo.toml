[package]
name = "tp-history"
description = "Write-once local store of historical trades, quotes and bars, read without look-ahead, for replay and backtests (TradierPro BACKTEST_PLAN.md)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
crc32fast = "1"
zstd = { version = "0.13", default-features = false }
